<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Pedido</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
  <link rel="stylesheet" href="/css/pedidos.css">
</head>

<body>
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item">
        <p class="title is-3 is-spaced">PEDIDOS</p>
      </a>
    </div>

    <div class="navbar-end">
      <div class="navbar-item">
        <div class="buttons">
          <a class="button is-primary" href="../index.html">
            <strong>home</strong>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <div class="container section">
    <div class="columns is-centered">
      <div class="column is-6">
        <div class="box">

          <h1 class="title has-text-centered">Formulario de Pedido</h1>

          <div>

            <div class="field">
              <label class="label">Nombre completo</label>
              <div class="control">
                <input class="input" type="text" placeholder="Ingrese su nombre completo" id="nombre_completo">
              </div>
            </div>

            <div class="field">
              <label class="label">Número de teléfono</label>
              <div class="control">
                <input class="input" type="tel" placeholder="Ingrese su número de teléfono" id="telefono">
              </div>
            </div>

            <div class="field">
              <label class="label">Dirección</label>
              <div class="control">
                <input class="input" type="text" placeholder="Ingrese su dirección de entrega" id="direccion">
              </div>
            </div>

            <div class="field">
              <label class="label">Correo electrónico</label>
              <div class="control">
                <input class="input" type="email" placeholder="Ingrese su correo electrónico" id="email">
              </div>
            </div>

            <div class="field">
              <label class="label">Método de pago</label>
              <div class="control">
                <div class="select is-fullwidth">
                  <select id="metodo_pago">
                    <option value="">Seleccione una opción</option>
                    <option value="Efectivo">Efectivo</option>
                    <option value="Tarjeta_Credito">Tarjeta de Crédito</option>
                    <option value="Transferencia_Bancaria">Transferencia Bancaria</option>
                    <option value="Nequi">Nequi</option>
                  </select>
                </div>
              </div>
            </div>

            <div class="field">
              <label class="label">Pedido</label>
              <div class="control">
                <textarea class="textarea" placeholder="Describa los productos de su pedido" id="pedido" rows="3"></textarea>
              </div>
            </div>

            <div class="field">
              <label class="label">Referencias de entrega</label>
              <div class="control">
                <textarea class="textarea" placeholder="Ej: Torre 2 Apt 501, frente al parque, portón blanco" id="referencias" rows="2"></textarea>
              </div>
            </div>

            <div class="field mt-5">
              <div class="control">
                <button class="button is-primary is-fullwidth" id="btnGuardar">
                  Enviar Pedido
                </button>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/pedidos.js"></script>
</body>

</html>
