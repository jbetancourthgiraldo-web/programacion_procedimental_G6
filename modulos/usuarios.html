<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuarios</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
</head>

<body>
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item">
        <p class="title is-3 is-spaced">USUARIO</p>
      </a>
    </div>

    <div class="navbar-end">
      <div class="navbar-item">
        <div class="buttons">
          <a class="button is-primary" href="../index.html">
            <strong>home</strong>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <h1 class="title has-text-centered">USUARIOS</h1>
      <hr>

      <div class="columns is-centered">
        <div class="column is-half">
          <div class="box">

            <div class="field">
              <label class="label">Nombre completo</label>
              <div class="control">
                <input class="input" type="text" placeholder="Ingrese su nombre completo" id="nombre_completo">
              </div>
            </div>

            <div class="field">
              <label class="label">Correo electrónico</label>
              <div class="control">
                <input class="input" type="email" placeholder="Ingrese su correo electrónico" id="email">
              </div>
            </div>

            <div class="field">
              <label class="label">Teléfono</label>
              <div class="control">
                <input class="input" type="tel" placeholder="Ingrese su número de teléfono" id="telefono">
              </div>
            </div>

            <div class="field">
              <label class="label">Dirección</label>
              <div class="control">
                <input class="input" type="text" placeholder="Ingrese su dirección" id="direccion">
              </div>
            </div>

            <div class="field">
              <label class="label">Producto favorito</label>
              <div class="control">
                <input class="input" type="text" placeholder="Ej: Pizza Napolitana, Hamburguesa Doble" id="producto_favorito">
              </div>
            </div>

            <div class="field">
              <label class="label">Comentarios adicionales</label>
              <div class="control">
                <textarea class="textarea" placeholder="Escriba aquí sus observaciones o comentarios" id="comentarios_adicionales" rows="3"></textarea>
              </div>
            </div>

            <div class="field is-grouped is-grouped-centered mt-5">
              <div class="control">
                <button class="button is-primary" id="btnGuardar">Aceptar</button>
              </div>
              <div class="control">
                <button class="button is-light" type="reset">Cancelar</button>
              </div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/usuarios.js"></script>
</body>

</html>
