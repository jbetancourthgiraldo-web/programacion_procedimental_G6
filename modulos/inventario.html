<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <title>Formulario de Inventario</title>
</head>

<body id="section">

    <h1 id="title">Formulario de Inventario</h1>

    <div id="box">
        <form>

            <div id="field">
                <label id="label">Nombre del Producto</label>
                <div id="control">
                    <input id="input" type="text" placeholder="Ingrese el nombre">
                </div>
            </div>

            <div id="field">
                <label id="label">Categoría</label>
                <div id="control">
                    <input id="input" type="text" placeholder="Ingrese la categoría">
                </div>
            </div>

            <div id="field">
                <label id="label">Precio Unitario</label>
                <div id="control">
                    <input id="input" type="number" placeholder="Ingrese el precio">
                </div>
            </div>

            <div id="field">
                <label id="label">Descripción</label>
                <div id="control">
                    <textarea id="textarea" placeholder="Descripción del producto"></textarea>
                </div>
            </div>

            <div id="field">
                <label id="label">Presentación</label>
                <div id="control">
                    <input id="input" type="text" placeholder="Ej: Lata, Botella">
                </div>
            </div>

            <div id="field">
                <label id="label">Marca</label>
                <div id="control">
                    <input id="input" type="text" placeholder="Ingrese la marca">
                </div>
            </div>

            <div id="field">
                <label id="label">Cantidad</label>
                <div id="control">
                    <input id="input" type="text" placeholder="Ej: 250 ml, 1 kg">
                </div>
            </div>

            <div id="field">
                <button id="button" type="submit">
                    Guardar Producto
                </button>
            </div>

        </form>
    </div>

    <a href="/index.html" id="link">
        Regresar
    </a>

</body>

</html>
