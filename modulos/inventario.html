<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Producto</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
</head>

<body>
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item">
        <p class="title is-3 is-spaced">inventario</p>
      </a>
    </div>

    <div class="navbar-end">
      <div class="navbar-item">
        <div class="buttons">
          <a class="button is-primary" href="../index.html">
            <strong>home</strong>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div class="columns is-centered">
        <div class="column is-6">
          <div class="box">

            <h1 class="title has-text-centered">
              Registro de Productos
            </h1>

            <div>

              <div class="field">
                <label class="label">Nombre del Producto</label>
                <div class="control">
                  <input class="input" type="text" name="nombre_producto" placeholder="Ingrese el nombre" id="nombre_producto">
                </div>
              </div>

              <div class="field">
                <label class="label">Categoría</label>
                <div class="control">
                  <div class="select is-fullwidth">
                    <select name="categoria_producto" id="categoria_producto">
                      <option value="">Seleccione una categoría</option>
                      <option value="alimento">Alimentos</option>
                      <option value="bebida">Bebidas</option>
                      <option value="limpieza">Limpieza</option>
                      <option value="tecnologia">Tecnología</option>
                      <option value="otros">Otros</option>
                    </select>
                  </div>
                </div>
              </div>

              <div class="field">
                <label class="label">Precio Unitario</label>
                <div class="control">
                  <input class="input" type="number" step="0.01" name="precio_unitario" placeholder="Ingrese el precio unitario" id="precio_unitario">
                </div>
              </div>

              <div class="field">
                <label class="label">Descripción</label>
                <div class="control">
                  <textarea class="textarea" name="descripcion_producto" placeholder="Ingrese una breve descripción" id="descripcion_producto" rows="2"></textarea>
                </div>
              </div>

              <div class="field">
                <label class="label">Presentación</label>
                <div class="control">
                  <input class="input" type="text" name="presentacion_producto" placeholder="Ej: Botella 500ml, Caja x 12, Bolsa 1kg" id="presentacion_producto">
                </div>
              </div>

              <div class="field">
                <label class="label">Marca</label>
                <div class="control">
                  <input class="input" type="text" name="marca_producto" placeholder="Ingrese la marca" id="marca_producto">
                </div>
              </div>

              <div class="field">
                <label class="label">Cantidad</label>
                <div class="control">
                  <input class="input" type="number" name="cantidad_producto" placeholder="Ingrese la cantidad en stock" id="cantidad_producto">
                </div>
              </div>

              <div class="field mt-5">
                <div class="control">
                  <button class="button is-primary is-fullwidth" id="btnGuardar">
                    Guardar Producto
                  </button>
                </div>
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../js/inventario.js"></script>
</body>

</html>
